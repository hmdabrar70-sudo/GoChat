<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>GoChat — Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#0a0a0f;
    color:#f0f0f5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .card{
    max-width:360px;
    width:100%;
  }
  .mark{
    width:72px;height:72px;margin:0 auto 20px;
    border-radius:20px;
    background:#14141c;
    border:1px solid #1c1c28;
    display:flex;align-items:center;justify-content:center;
  }
  .mark svg{width:40px;height:40px;}
  h1{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;}
  p{font-size:14px;line-height:1.5;color:#a0a0b5;margin-bottom:24px;}
  button{
    appearance:none;border:0;cursor:pointer;
    width:100%;height:48px;border-radius:14px;
    font-size:15px;font-weight:700;
    color:#0a0a0f;
    background:linear-gradient(135deg,#252936 0%,#3b4252 50%,#596273 100%);
  }
  button:active{transform:scale(0.98);}
  .hint{margin-top:14px;font-size:12px;color:#6a6a80;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 7.5C4 5.567 5.567 4 7.5 4h9C18.433 4 20 5.567 20 7.5v5c0 1.933-1.567 3.5-3.5 3.5H12l-4 3.5V16H7.5C5.567 16 4 14.433 4 12.5v-5z" stroke="#f0f0f5" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="9" cy="10" r="1" fill="#f0f0f5"/>
        <circle cx="12" cy="10" r="1" fill="#f0f0f5"/>
        <circle cx="15" cy="10" r="1" fill="#f0f0f5"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>GoChat needs a connection for live chat, feed and uploads. Check your network, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint">Your app shell is still installed — reconnect to continue.</div>
  </div>
</body>
</html>
